  <script>
    (function () {
      const encodedSource =
        document.getElementById("original-source-base64").textContent.trim();

      function decodeBase64Utf8(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder("utf-8").decode(bytes);
      }

      let source = decodeBase64Utf8(encodedSource);

      // Remove the original module imports because this is a standalone HTML file.
      source = source.replace(
        /import React, \{[\s\S]*?\} from ['"]lucide-react['"];\s*/,
        ""
      );

      source = source.replace(
        /export default function App\(/,
        "function App("
      );

      /*
       * Browser adapter for Lucide.
       *
       * lucide-react is an npm/ES-module React package and does not expose
       * a "LucideReact" global in this browser setup. The vanilla Lucide
       * UMD build exposes icon definitions on "lucide.icons".
       *
       * This adapter turns those icon definitions into React components,
       * so the original JSX such as <Shield />, <Zap />, etc. continues
       * to work without changing the original source.
       */
      const iconNames = [
        "Shield", "Zap", "Trophy", "Briefcase", "Wallet", "RefreshCw",
        "Award", "Activity", "CheckCircle2", "XCircle", "User",
        "ExternalLink", "Lock", "Unlock", "Package", "Plus", "ArrowRight",
        "Search", "Filter", "Sparkles", "ChevronRight", "Coins", "Flame",
        "TrendingUp", "Globe", "Layers", "Settings", "Play", "Check",
        "Copy", "Info", "Sliders", "PieChart", "Repeat", "ChevronDown",
        "Dumbbell", "Star", "AlertCircle", "ArrowUpRight", "BarChart3"
      ];

      function toReactAttr(name) {
        const map = {
          "class": "className",
          "class-name": "className",
          "stroke-width": "strokeWidth",
          "stroke-linecap": "strokeLinecap",
          "stroke-linejoin": "strokeLinejoin",
          "fill-rule": "fillRule",
          "clip-rule": "clipRule",
          "fill-opacity": "fillOpacity",
          "stroke-opacity": "strokeOpacity",
          "stroke-dasharray": "strokeDasharray",
          "stroke-dashoffset": "strokeDashoffset",
          "font-size": "fontSize"
        };
        if (map[name]) return map[name];
        return name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
      }

      function iconNodeToReact(node, key) {
        if (!Array.isArray(node) || node.length < 2) return null;

        const tag = node[0];
        const attrs = node[1] || {};
        const children = node.slice(2);

        const props = { key };
        Object.keys(attrs).forEach((name) => {
          props[toReactAttr(name)] = attrs[name];
        });

        return React.createElement(
          tag,
          props,
          children.map((child, index) =>
            iconNodeToReact(child, index)
          )
        );
      }

      function makeLucideComponent(name) {
        return function LucideIcon(props) {
          const iconNode = window.lucide &&
            window.lucide.icons &&
            window.lucide.icons[name];

          if (!iconNode) {
            return React.createElement(
              "span",
              {
                ...props,
                title: "Lucide icon not found: " + name
              }
            );
          }

          const {
            size = 24,
            strokeWidth = 2,
            absoluteStrokeWidth,
            color,
            ...rest
          } = props || {};

          const svgProps = {
            width: size,
            height: size,
            viewBox: "0 0 24 24",
            fill: "none",
            stroke: color || "currentColor",
            strokeWidth,
            strokeLinecap: "round",
            strokeLinejoin: "round",
            "aria-hidden": true,
            ...rest
          };

          if (absoluteStrokeWidth) {
            svgProps.strokeWidth = (Number(strokeWidth) * 24) / Number(size);
          }

          return React.createElement(
            "svg",
            svgProps,
            iconNode.map((child, index) =>
              iconNodeToReact(child, index)
            )
          );
        };
      }

      const LucideReact = {};
      iconNames.forEach((name) => {
        LucideReact[name] = makeLucideComponent(name);
      });

      const iconBindings =
        "const { " + iconNames.join(", ") + " } = LucideReact;\n" +
        "const { useState, useEffect, useMemo } = React;\n";

      const executableSource =
        iconBindings +
        source +
        "\nReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));";

      try {
        const transformed = Babel.transform(executableSource, {
          presets: [["react", { runtime: "classic" }]]
        }).code;

        const runner = new Function(
          "React",
          "ReactDOM",
          "LucideReact",
          transformed
        );

        runner(React, ReactDOM, LucideReact);
      } catch (error) {
        console.error(error);
        document.getElementById("root").innerHTML = `
          <div style="min-height:100vh;background:#020617;color:#f8fafc;
                      font-family:system-ui,sans-serif;padding:32px;box-sizing:border-box">
            <h1 style="color:#fb7185">Application failed to start</h1>
            <pre style="white-space:pre-wrap;color:#cbd5e1">${String(error.stack || error)}</pre>
          </div>
        `;
      }
    })();
  </script>
